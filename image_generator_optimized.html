// ===== Export / Import =====
async function exportAll() {
  try {
    const history = await loadHistory();
    // API key deliberately NOT exported: backup files may be shared.
    // Import still accepts old backups that carry an apiKey field.
    const settings = {
      baseUrl: localStorage.getItem(BASEURL_KEY) || '',
      form: JSON.parse(localStorage.getItem(PERSIST_KEY) || '{}')
    };
    const exportHistory = history.map(item => {
      if (!useLocalFS || !dirHandle || !item.filenames || item.images) return item;
      return { ...item, _needsRead: true };
    });
    for (const item of exportHistory) {
      if (!item._needsRead) continue;
      delete item._needsRead;
      const images = [];
      for (const fname of item.filenames) {
        try {
          const fh = await dirHandle.getFileHandle(fname);
          const file = await fh.getFile();
          // FileReader encodes in native code; the old per-byte string
          // concatenation froze the page on large files
          images.push({ b64_json: await blobToBase64(file) });
        } catch {
          images.push({ b64_json: '' });
        }
      }
      item.images = images;
      delete item.filenames;
    }
    const blob = new Blob([JSON.stringify({ settings, history: exportHistory }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `gpt-image-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    console.error('Export failed:', e);
    showError('匯出失敗');
  }
}

function validateImportData(data) {
  if (!data || typeof data !== 'object') return '檔案內容不是有效的 JSON 物件';
  if (!data.settings || typeof data.settings !== 'object') return '缺少 settings 欄位';
  if (!Array.isArray(data.history)) return '缺少 history 陣列';
  const s = data.settings;
  if (s.baseUrl != null && typeof s.baseUrl !== 'string') return 'settings.baseUrl 必須是字串';
  if (s.apiKey != null && typeof s.apiKey !== 'string') return 'settings.apiKey 必須是字串';
  if (s.form != null && typeof s.form !== 'object') return 'settings.form 必須是物件';
  if (s.form) {
    for (const [k, v] of Object.entries(s.form)) {
      if (!PERSIST_FIELDS.includes(k)) return `settings.form 含有未知欄位：${k}`;
      if (typeof v !== 'string') return `settings.form.${k} 必須是字串`;
    }
  }
  return null;
}

function validateHistoryItem(item, index) {
  if (!item || typeof item !== 'object') return `第 ${index + 1} 筆：不是有效物件`;
  if (typeof item.id !== 'number' || !Number.isFinite(item.id) || item.id <= 0) return `第 ${index + 1} 筆：id 無效`;
  if (!VALID_TYPES.includes(item.type)) return `第 ${index + 1} 筆：type 必須是 generate 或 edit`;
  if (typeof item.prompt !== 'string' || !item.prompt.trim()) return `第 ${index + 1} 筆：prompt 無效`;
  if (item.fmt != null && !VALID_FORMATS.includes(item.fmt)) return `第 ${index + 1} 筆：fmt 必須是 png/jpeg/webp`;
  if (typeof item.time !== 'string') return `第 ${index + 1} 筆：time 無效`;
  if (!Array.isArray(item.images) || item.images.length === 0) return `第 ${index + 1} 筆：缺少 images`;
  if (item.images.length > MAX_IMAGES_PER_ITEM) return `第 ${index + 1} 筆：images 數量超過上限`;
  for (let i = 0; i < item.images.length; i++) {
    const img = item.images[i];
    if (!img || typeof img !== 'object') return `第 ${index + 1} 筆圖片 ${i + 1}：不是有效物件`;
    if (!img.b64_json && !img.url) return `第 ${index + 1} 筆圖片 ${i + 1}：缺少 b64_json 或 url`;
    if (img.b64_json && (typeof img.b64_json !== 'string' || img.b64_json.length > MAX_B64_LENGTH)) return `第 ${index + 1} 筆圖片 ${i + 1}：b64_json 無效或過大`;
    if (img.url && typeof img.url !== 'string') return `第 ${index + 1} 筆圖片 ${i + 1}：url 無效`;
    if (img.url && !sanitizeUrl(img.url)) return `第 ${index + 1} 筆圖片 ${i + 1}：url 不允許的協定`;
  }
  return null;
}

function sanitizeHistoryItem(item) {
  return {
    id: item.id,
    type: item.type,
    prompt: item.prompt,
    images: item.images.map(img => {
      const clean = {};
      if (img.b64_json) clean.b64_json = img.b64_json;
      if (img.url) clean.url = img.url;
      return clean;
    }),
    fmt: item.fmt || 'png',
    time: item.time
  };
}

async function importAll(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  try {
    const text = await file.text();
    let data;
    try { data = JSON.parse(text); } catch { throw new Error('JSON 解析失敗'); }

    const structErr = validateImportData(data);
    if (structErr) throw new Error(structErr);

    const s = data.settings;
    if (s.baseUrl) { localStorage.setItem(BASEURL_KEY, s.baseUrl); baseUrlEl.value = s.baseUrl; }
    if (s.apiKey) { localStorage.setItem(APIKEY_KEY, s.apiKey); apiKeyEl.value = s.apiKey; }
    if (s.form) { localStorage.setItem(PERSIST_KEY, JSON.stringify(s.form)); loadFormState(); }

    const db = await openDB();
    let imported = 0, skipped = 0;
    for (let idx = 0; idx < data.history.length; idx++) {
      const raw = data.history[idx];
      const itemErr = validateHistoryItem(raw, idx);
      if (itemErr) { console.warn('匯入跳過：' + itemErr); skipped++; continue; }
      let item = sanitizeHistoryItem(raw);

      if (useLocalFS && dirHandle && item.images) {
        const ext = imageExtension(item.fmt);
        const filenames = [];
        for (let i = 0; i < item.images.length; i++) {
          const img = item.images[i];
          if (!img.b64_json) continue;
          const fname = `${item.id}_${i}.${ext}`;
          await writeLocalFile(fname, base64ToBytes(img.b64_json));
          filenames.push(fname);
        }
        item = { id: item.id, type: item.type, prompt: item.prompt, filenames, fmt: item.fmt, time: item.time };
      }
      await new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(item);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      invalidateGalleryCache(item.id);
      imported++;
    }
    renderGallery();
    const msg = skipped ? `已匯入 ${imported} 筆，跳過 ${skipped} 筆無效記錄` : `已匯入 ${imported} 筆記錄`;
    document.getElementById('status').textContent = msg;
  } catch (e) {
    console.error('Import failed:', e);
    showError('匯入失敗：' + e.message);
  }
}

// ===== Chat: iterative refinement (對話微調) =====
// A conversation is a chain of edits: each turn feeds the previous turn's output
// image back into /images/edits, so the model refines the same picture step by step.
// Stored independently of the gallery in the `conversations` object store.
let activeConv = null;
let currentView = 'gallery';
let chatBusy = false;
let chatDeleting = false;
let chatController = null;    // in-flight chat request; null when idle
let chatUserStopped = false;  // distinguishes user stop from timeout on AbortError
let chatPartialUrl = null;    // partial preview blob URL for the temp bubble
let chatRenderVersion = 0;
const chatBlobCache = new Map();   // fname -> object URL (FS mode), revoked on unload

// Temporary streaming bubble at the end of the chat; not part of activeConv,
// so the next renderChat() naturally clears it.
function showChatPartial(b64, fmt) {
  try {
    const messages = document.getElementById('chatMessages');
    let card = document.getElementById('chatPartialCard');
    if (!card) {
      card = document.createElement('div');
      card.id = 'chatPartialCard';
      card.className = 'chat-msg image';
      card.innerHTML = '<span class="chat-seed-tag">串流中…</span><div class="chat-img-card"><img alt=""></div>';
      messages.appendChild(card);
    }
    const mime = imageMimeType(fmt);
    if (chatPartialUrl) URL.revokeObjectURL(chatPartialUrl);
    chatPartialUrl = b64ToObjectUrl(b64, mime);
    card.querySelector('img').src = chatPartialUrl;
    messages.scrollTop = messages.scrollHeight;
  } catch (e) {
    console.warn('skip malformed partial image:', e);
  }
}
function removeChatPartial() {
  const card = document.getElementById('chatPartialCard');
  if (card) card.remove();
  if (chatPartialUrl) { URL.revokeObjectURL(chatPartialUrl); chatPartialUrl = null; }
}
// The send button doubles as a stop button while a request is in flight
function chatSendOrStop() {
  if (chatBusy) {
    if (chatController) { chatUserStopped = true; chatController.abort(); }
    return;
  }
  sendChatTurn();
}

function revokeChatBlobs() {
  chatBlobCache.forEach(url => URL.revokeObjectURL(url));
  chatBlobCache.clear();
}

// ---- persistence ----
async function saveConversation(conv) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_CONV, 'readwrite');
    tx.objectStore(DB_CONV).put(conv);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
async function loadConversations() {
  try {
    const db = await openDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_CONV, 'readonly');
      const req = tx.objectStore(DB_CONV).getAll();
      req.onsuccess = () => resolve((req.result || []).sort((a, b) => b.updatedAt - a.updatedAt));
      req.onerror = () => reject(req.error);
    });
  } catch (e) {
    console.error('loadConversations failed:', e);
    return [];
  }
}
async function loadConversation(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_CONV, 'readonly');
    const req = tx.objectStore(DB_CONV).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function deleteConversation(id) {
  const db = await openDB();
  const conv = await loadConversation(id);
  if (conv && useLocalFS && dirHandle) {
    for (const turn of conv.turns) {
      if (!turn.filenames) continue;
      for (const fname of turn.filenames) {
        try { await dirHandle.removeEntry(fname); } catch {}
      }
    }
  }
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_CONV, 'readwrite');
    tx.objectStore(DB_CONV).delete(id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

// ---- image helpers ----
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => { const s = reader.result; resolve(s.slice(s.indexOf(',') + 1)); };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}
// Resolve a turn's first image to a displayable URL (blob in FS mode, data/remote URL otherwise)
async function turnImageSrc(turn) {
  if (turn.filenames && turn.filenames.length) {
    const fname = turn.filenames[0];
    if (chatBlobCache.has(fname)) return chatBlobCache.get(fname);
    if (useLocalFS && dirHandle) {
      try {
        const fh = await dirHandle.getFileHandle(fname);
        const file = await fh.getFile();
        const url = URL.createObjectURL(file);
        chatBlobCache.set(fname, url);
        return url;
      } catch { return ''; }
    }
    return '';
  }
  if (turn.images && turn.images.length) {
    const img = turn.images[0];
    const mime = imageMimeType(turn.fmt);
    return sanitizeUrl(img.url || `data:${mime};base64,${img.b64_json}`);
  }
  return '';
}
// Convert any displayable src into a File for the edits endpoint
async function srcToFile(src, fmt) {
  const resp = await fetch(src);
  const blob = await resp.blob();
  const ext = imageExtension(fmt);
  return new File([blob], `input.${ext}`, { type: blob.type || 'image/png' });
}
// In FS mode, persist returned images to the local folder and return filenames; else null
async function persistTurnImages(convId, turnIdx, images, fmt) {
  if (!(useLocalFS && dirHandle)) return null;
  return persistImages(images, fmt, `conv_${convId}_${turnIdx}`);
}
function latestImageTurn(conv) {
  if (!conv) return null;
  for (let i = conv.turns.length - 1; i >= 0; i--) {
    const t = conv.turns[i];
    if ((t.filenames && t.filenames.length) || (t.images && t.images.length)) return t;
  }
  return null;
}

// ---- view switching ----
function switchView(name) {
  if (name !== 'gallery' && name !== 'chat') return;
  currentView = name;
  const area = document.querySelector('.gallery-area');
  document.querySelectorAll('#viewSwitch button').forEach(b =>
    b.classList.toggle('active', b.dataset.view === name));
  if (name === 'chat') {
    area.classList.add('chat-mode');
    if (activeConv) renderChat();
    else loadActiveConversation();
  } else {
    area.classList.remove('chat-mode');
  }
}

// ---- conversation lifecycle ----
function newConversation() {
  if (currentView !== 'chat') switchView('chat');
  activeConv = null;
  closeChatHistory();
  renderChat();
  document.getElementById('chatInput').focus();
}
async function loadActiveConversation() {
  const list = await loadConversations();
  activeConv = list.length ? list[0] : null;
  renderChat();
}
async function startChatFromImage(item) {
  if (!item || !item.src) return;
  const extOf = (item.filename || '').split('.').pop().toLowerCase();
  const fmt = extOf === 'jpg' ? 'jpeg' : (extOf === 'webp' ? 'webp' : 'png');
  const now = Date.now();
  const time = new Date().toLocaleString('zh-TW');
  // The seed turn owns its own copy of the picked image so it survives independently
  // of the gallery item (which the user may later delete).
  let images = null, filenames = null;
  try {
    if (useLocalFS && dirHandle) {
      const file = await srcToFile(item.src, fmt);
      const ext = imageExtension(fmt);
      const fname = `conv_${now}_0_0.${ext}`;
      await writeLocalFile(fname, file);
      filenames = [fname];
    } else {
      const resp = await fetch(item.src);
      const blob = await resp.blob();
      images = [{ b64_json: await blobToBase64(blob) }];
    }
  } catch (e) {
    console.error('startChatFromImage seed failed:', e);
    switchView('chat');
    showChatStatus('無法載入起點圖片', true);
    return;
  }
  activeConv = {
    id: now, title: (item.prompt || '對話微調').slice(0, 24), time,
    createdAt: now, updatedAt: now,
    turns: [{ kind: 'seed', prompt: item.prompt || '', images, filenames, fmt, time }]
  };
  await saveConversation(activeConv);
  closeLightbox();
  switchView('chat');
  showChatStatus('');
  document.getElementById('chatInput').focus();
}
function startChatFromLightbox() {
  const item = galleryFlatList[lightboxIndex];
  if (item) startChatFromImage(item);
}
async function deleteActiveConversation() {
  if (!activeConv) return;
  await deleteChatHistoryItem(activeConv.id);
}
async function deleteChatHistoryItem(id) {
  if (chatDeleting) return;
  if (chatBusy) {
    showChatStatus('請先停止生成，再刪除對話', true);
    return;
  }
  if (!confirm('確定刪除此對話？本地資料夾的圖片也會一併移除。')) return;
  chatDeleting = true;
  try {
    await deleteConversation(id);
    if (activeConv && activeConv.id === id) {
      activeConv = null;
      await loadActiveConversation();
    }
    if (document.getElementById('chatHistPanel').classList.contains('open')) {
      await renderChatHistory();
    }
    showChatStatus('');
  } catch (e) {
    console.error('deleteConversation failed:', e);
    showChatStatus('刪除對話失敗，請重試', true);
  } finally {
    chatDeleting = false;
  }
}

// ---- sending a turn ----
async function sendChatTurn() {
  if (chatBusy || chatDeleting) return;
  const input = document.getElementById('chatInput');
  const prompt = input.value.trim();
  if (!prompt) { input.focus(); return; }
  const base = requireBaseUrl();
  if (!base) return;

  const seedTurn = latestImageTurn(activeConv);
  const hasImage = !!seedTurn;
  const fmt = 'png';
  // Same streaming preference as the generate tab
  const partials = getPartialImageCount();
  chatBusy = true;
  chatUserStopped = false;
  chatController = new AbortController();
  const timeoutId = setTimeout(() => chatController.abort(), API_TIMEOUT_MS);
  const sendBtn = document.getElementById('chatSendBtn');
  sendBtn.textContent = '停止';

  const now = Date.now();
  if (!activeConv) {
    const time = new Date().toLocaleString('zh-TW');
    activeConv = { id: now, title: prompt.slice(0, 24), time, createdAt: now, updatedAt: now, turns: [] };
  }
  // The request belongs to this conversation even if the user opens a new one.
  const conversation = activeConv;
  conversation.turns.push({ kind: 'user', prompt, time: new Date().toLocaleString('zh-TW') });
  renderChat();
  input.value = '';

  try {
    let data;
    const onPartial = (b64) => {
      if (activeConv !== conversation) return;
      showChatStatus('串流中…');
      showChatPartial(b64, fmt);
    };
    if (hasImage) {
      showChatStatus('微調中...');
      const src = await turnImageSrc(seedTurn);
      if (!src) throw new Error('找不到可用的輸入圖片');
      const file = await srcToFile(src, seedTurn.fmt || 'png');
      const formData = new FormData();
      formData.append('model', IMAGE_MODEL);
      formData.append('prompt', prompt);
      formData.append('n', '1');
      formData.append('image[]', file);
      if (partials > 0) {
        formData.append('stream', 'true');
        formData.append('partial_images', String(partials));
        data = await callEditAPIStream(formData, { signal: chatController.signal, onPartial });
      } else {
        data = await callEditAPI(formData,
          (pct) => {
            if (activeConv === conversation) showChatStatus(pct < 100 ? `上傳中 ${pct}%...` : '生成中...');
          },
          chatController.signal);
      }
    } else {
      showChatStatus(partials > 0 ? '串流生成中...' : '生成中...');
      const body = { model: IMAGE_MODEL, prompt, n: 1 };
      if (partials > 0) {
        body.stream = true;
        body.partial_images = partials;
        data = await callGenerateAPIStream(body, { signal: chatController.signal, onPartial });
      } else {
        data = await callGenerateAPI(body, chatController.signal);
      }
    }
    if (!data || !Array.isArray(data.data) || !data.data.length) {
      throw new Error('回應中沒有圖片資料');
    }
    const images = data.data;
    const turnIdx = conversation.turns.length;
    const filenames = await persistTurnImages(conversation.id, turnIdx, images, fmt);
    conversation.turns.push({
      kind: hasImage ? 'edit' : 'generate', prompt,
      images: filenames ? null : images, filenames, fmt,
      time: new Date().toLocaleString('zh-TW')
    });
    conversation.updatedAt = Date.now();
    await saveConversation(conversation);
    if (activeConv === conversation) {
      showChatStatus('');
      renderChat();
    }
  } catch (e) {
    if (activeConv !== conversation) {
      console.error('sendChatTurn failed for conversation', conversation.id, e);
      return;
    }
    if (e.name === 'AbortError') {
      if (chatUserStopped) showChatStatus('已停止');
      else showChatStatus('請求超時（超過5分鐘），請稍後重試', true);
    } else {
      console.error('sendChatTurn failed:', e);
      showChatStatus('錯誤：' + explainFetchFailure(e), true);
    }
  } finally {
    clearTimeout(timeoutId);
    chatController = null;
    chatBusy = false;
    removeChatPartial();
    sendBtn.textContent = '送出';
    sendBtn.disabled = false;
  }
}

function showChatStatus(msg, isError) {
  const el = document.getElementById('chatStatus');
  if (!el) return;
  el.textContent = msg || '';
  el.style.color = isError ? 'var(--danger)' : 'var(--text-secondary)';
}

// ---- rendering ----
async function renderChat() {
  const version = ++chatRenderVersion;
  const conversation = activeConv;
  const titleEl = document.getElementById('chatTitle');
  const messages = document.getElementById('chatMessages');
  const delBtn = document.getElementById('chatDelBtn');
  if (!messages) return;
  titleEl.textContent = conversation ? (conversation.title || '對話') : '新對話';
  delBtn.style.display = conversation ? '' : 'none';

  if (!conversation || !conversation.turns.length) {
    messages.innerHTML = `<div class="chat-empty">從畫廊任一張圖點「對話微調」，<br>或在下方直接輸入提示詞開始。<br><br>之後每一輪都會以上一張圖為基礎，連續修改。</div>`;
    return;
  }
  messages.innerHTML = '';
  const turns = [...conversation.turns];
  for (let i = 0; i < turns.length; i++) {
    const turn = turns[i];
    if (turn.kind === 'user') {
      const div = document.createElement('div');
      div.className = 'chat-msg user';
      div.innerHTML = `<div class="chat-bubble">${escapeHtml(turn.prompt)}</div><span class="chat-msg-time">${escapeHtml(turn.time || '')}</span>`;
      messages.appendChild(div);
      continue;
    }
    const src = await turnImageSrc(turn);
    if (version !== chatRenderVersion || activeConv !== conversation) return;
    const ext = imageExtension(turn.fmt);
    const safeSrc = escapeHtml(src);
    const div = document.createElement('div');
    div.className = 'chat-msg image';
    div.innerHTML = `${turn.kind === 'seed' ? '<span class="chat-seed-tag">起點</span>' : ''}
      <div class="chat-img-card">${src
        ? `<img src="${safeSrc}" alt="" loading="lazy">`
        : '<div style="padding:24px;color:var(--text-tertiary);font-size:12px;">圖片已遺失</div>'}</div>
      <div class="chat-img-actions">
        ${src ? `<a href="${safeSrc}" download="chat_${conversation.id}_${i}.${ext}">下載</a>` : ''}
        ${turn.prompt ? `<button data-chat-copy-idx="${i}">複製提示詞</button>` : ''}
      </div>`;
    messages.appendChild(div);
  }
  messages.scrollTop = messages.scrollHeight;
}

function openChatImage(src) {
  if (!src) return;
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxPrompt').textContent = '';
  const dl = document.getElementById('lightboxDl'); dl.href = src; dl.download = 'image.png';
  document.getElementById('lightboxCounter').textContent = '';
  document.getElementById('lightboxPrev').disabled = true;
  document.getElementById('lightboxNext').disabled = true;
  lightboxIndex = -1;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

// ---- chat history dropdown ----
async function toggleChatHistory() {
  const panel = document.getElementById('chatHistPanel');
  if (panel.classList.contains('open')) { closeChatHistory(); return; }
  await renderChatHistory();
  panel.classList.add('open');
}
async function renderChatHistory() {
  const panel = document.getElementById('chatHistPanel');
  const list = await loadConversations();
  panel.innerHTML = list.length
    ? list.map(c => `<div class="chat-hist-item ${activeConv && c.id === activeConv.id ? 'active' : ''}" data-conv-id="${c.id}">
        <span class="chat-hist-info"><span class="chat-hist-title">${escapeHtml(c.title || '對話')}</span><span class="chat-hist-time">${escapeHtml(c.time || '')}</span></span>
        <button type="button" class="chat-hist-delete" data-delete-conv-id="${c.id}" aria-label="刪除對話：${escapeHtml(c.title || '對話')}">刪除</button>
      </div>`).join('')
    : '<div class="chat-hist-empty">尚無對話</div>';
}
function closeChatHistory() {
  const panel = document.getElementById('chatHistPanel');
  if (panel) panel.classList.remove('open');
}

// ---- chat event wiring ----
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatTurn(); }
});
document.getElementById('chatMessages').addEventListener('click', (e) => {
  const img = e.target.closest('.chat-img-card img');
  if (img) { openChatImage(img.src); return; }
  const copyBtn = e.target.closest('[data-chat-copy-idx]');
  if (copyBtn && activeConv) {
    const t = activeConv.turns[parseInt(copyBtn.dataset.chatCopyIdx)];
    if (t) navigator.clipboard.writeText(t.prompt).then(() => {
      const orig = copyBtn.textContent; copyBtn.textContent = '已複製';
      setTimeout(() => copyBtn.textContent = orig, 1500);
    });
  }
});
document.getElementById('chatHistPanel').addEventListener('click', async (e) => {
  const deleteBtn = e.target.closest('[data-delete-conv-id]');
  if (deleteBtn) {
    e.stopPropagation();
    deleteBtn.disabled = true;
    try {
      await deleteChatHistoryItem(Number(deleteBtn.dataset.deleteConvId));
    } finally {
      deleteBtn.disabled = false;
    }
    return;
  }
  if (chatBusy || chatDeleting) return;
  const item = e.target.closest('[data-conv-id]');
  if (!item) return;
  const conv = await loadConversation(parseInt(item.dataset.convId));
  if (conv) { activeConv = conv; renderChat(); }
  closeChatHistory();
});
document.addEventListener('click', (e) => {
  const panel = document.getElementById('chatHistPanel');
  if (!panel.classList.contains('open')) return;
  if (!e.target.closest('.chat-hist-wrap')) closeChatHistory();
});
window.addEventListener('beforeunload', revokeChatBlobs);

// Init
window.addEventListener('beforeunload', () => {
  blobUrlCache.forEach(url => URL.revokeObjectURL(url));
  blobUrlCache.clear();
  if (streamObjectUrl) URL.revokeObjectURL(streamObjectUrl);
  if (chatPartialUrl) URL.revokeObjectURL(chatPartialUrl);
});

migrateFromLocalStorage()
  .then(() => loadDirHandle())
  .then(() => {
    if (FS_SUPPORTED) {
      const btn = document.getElementById('fsDirBtn');
      btn.style.display = '';
    }
    updateFsUI();
    renderGallery();
  });
</script>
</body>
